name: Build & Sign ParkPro Android APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Signed Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle 8.2.2
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2.2'

      - name: Build Android Release APK
        working-directory: ./android
        run: |
          gradle assembleRelease --stacktrace --no-daemon

      - name: Sign APK (Using Secret Keystore or Auto-Generated Release Key)
        run: |
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          APKSIGNER="$BUILD_TOOLS_DIR/apksigner"
          
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "Using provided repository secrets keystore..."
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > release.keystore
            KEY_ALIAS="${{ secrets.ANDROID_KEY_ALIAS || 'parkpro' }}"
            STORE_PASS="${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'android' }}"
            KEY_PASS="${{ secrets.ANDROID_KEY_PASSWORD || 'android' }}"
          else
            echo "No custom keystore secrets detected. Generating release signing key..."
            keytool -genkey -v -keystore release.keystore -alias parkpro -keyalg RSA -keysize 2048 -validity 10000 -storepass parkpro123 -keypass parkpro123 -dname "CN=ParkPro, OU=Mobile, O=ParkPro, L=City, S=State, C=PK"
            KEY_ALIAS="parkpro"
            STORE_PASS="parkpro123"
            KEY_PASS="parkpro123"
          fi

          RAW_APK=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          echo "Signing: $RAW_APK"
          $APKSIGNER sign --ks release.keystore --ks-pass pass:$STORE_PASS --key-pass pass:$KEY_PASS --ks-key-alias $KEY_ALIAS --out android/app/build/outputs/apk/release/ParkPro-v1.0-release.apk "$RAW_APK"
          
          echo "Verifying signature..."
          $APKSIGNER verify android/app/build/outputs/apk/release/ParkPro-v1.0-release.apk

      - name: Upload Signed APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ParkPro-Signed-Release-APK
          path: android/app/build/outputs/apk/release/ParkPro-v1.0-release.apk
          retention-days: 14

      - name: Create GitHub Release on Tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/release/ParkPro-v1.0-release.apk
          generate_release_notes: true
